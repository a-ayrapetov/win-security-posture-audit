# Cloudflare AI on GitHub: reviews every pull request and triages every new issue. Model: Workers AI gpt-oss-120b.
# Secrets: CF_AI_TOKEN (Cloudflare token with Workers AI only), CF_ACCOUNT_ID. Installed by SharedKB\tools\github-ai-rollout.ps1.
# Tests: node .github/tests/github-ai.test.mjs .github/workflows/github-ai.yml
name: github-ai
on:
  pull_request: { types: [opened, synchronize, reopened, ready_for_review] }
  issues: { types: [opened] }
permissions: { contents: read, pull-requests: write, issues: write }
concurrency: { group: "github-ai-${{ github.event.pull_request.number || github.event.issue.number }}", cancel-in-progress: true }
jobs:
  ai:
    # ADDED 2026-11-13: on a public repo anyone can open an issue, and issue events get the secrets; triage only for people with a role here
    if: github.actor != 'dependabot[bot]' && github.actor != 'github-actions[bot]' && (github.event_name != 'issues' || contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/github-script@v7
        env: { CF_AI_TOKEN: "${{ secrets.CF_AI_TOKEN }}", CF_ACCOUNT_ID: "${{ secrets.CF_ACCOUNT_ID }}" }
        with:
          script: |
            // CHANGED 2026-11-13 (empty comments): max_tokens set, every known reply shape read, an empty answer fails the job.
            // CHANGED 2026-11-13 (review on #3): a cut-off reply fails, network/429/5xx get one retry, a non-JSON reply shows its start.
            // CHANGED 2026-11-13 (review v2, after a review on sharedkb #8 claimed variables were undefined that were defined
            // outside the diff hunks): the model gets the full changed files, must quote the line behind every point, and points
            // whose quote is not in the code are dropped; severity and at most 10 points; one comment per PR, edited on each push;
            // a PR merged before the review finished is flagged in the comment.
            // CHANGED 2026-11-13 (v3, the noise: 25-point reviews and a new email per push): a point is shown only when it is BLOCKER
            // or SHOULD and its quote is in the file it names (full text at head, or that file's added lines), as a whole line or
            // 15+ characters; NITs are counted, not shown; no unchecked summary; a reply that is not JSON fails and posts nothing;
            // model text cannot @mention, embed images or HTML; 240 s timeout per request with the body read inside the retry.
            const MODEL = 'gpt-oss-120b';
            const MARK = '<!-- github-ai-review -->';
            const OLD_MARKS = [MARK, '<!-- cloudflare-ai-review -->']; // comments from earlier versions are edited, not duplicated
            const FILE_CAP = 40000, FILES_TOTAL = 90000, DIFF_CAP = 40000; // EDIT: characters sent to the model
            const SHOW = 10;           // EDIT: most points shown in the comment
            const TIMEOUT_MS = 240000; // EDIT: per request. Real reviews took up to 165 s per job (2026-11-13); 2 x 240 s + 30 s wait stays under the 10-minute job limit
            if (!process.env.CF_AI_TOKEN || !process.env.CF_ACCOUNT_ID) throw new Error('CF_AI_TOKEN or CF_ACCOUNT_ID is not set (GitHub does not pass secrets to pull requests from forks)');
            const text = (o) => {
              if (typeof o?.response === 'string' && o.response.trim()) return o.response;
              if (typeof o?.output_text === 'string' && o.output_text.trim()) return o.output_text;
              const c = o?.choices?.[0]?.message?.content; if (typeof c === 'string' && c.trim()) return c;
              if (Array.isArray(o?.output)) return o.output.filter((x) => x?.type !== 'reasoning' && Array.isArray(x?.content)).flatMap((x) => x.content).map((p) => (typeof p === 'string' ? p : p?.text ?? '')).join('');
              return '';
            };
            const cutOff = (o) => o?.choices?.[0]?.finish_reason === 'length' || o?.status === 'incomplete';
            // Retry-After in seconds, held to 1..30; missing, zero or an HTTP date waits 5.
            const backoff = (h) => Math.min(Math.max(Number(h) || 5, 1), 30) * 1000;
            const call = async (payload) => {
              for (let attempt = 1; ; attempt++) {
                let r; let raw;
                try {
                  r = await fetch(`https://api.cloudflare.com/client/v4/accounts/${process.env.CF_ACCOUNT_ID}/ai/run/@cf/openai/${MODEL}`, {
                    method: 'POST', headers: { Authorization: `Bearer ${process.env.CF_AI_TOKEN}`, 'Content-Type': 'application/json' }, body: payload,
                    signal: AbortSignal.timeout(TIMEOUT_MS) });
                  raw = await r.text(); // inside the try: a timeout or reset while the body arrives is retried too
                } catch (e) {
                  // no complete response means no Retry-After header to trust: fixed 5 s, then one retry
                  if (attempt < 2) { await new Promise((res) => setTimeout(res, 5000)); continue; }
                  throw new Error(`Workers AI request failed: ${e.message}`, { cause: e });
                }
                if ((r.status === 429 || r.status >= 500) && attempt < 2) { await new Promise((res) => setTimeout(res, backoff(r.headers.get('retry-after')))); continue; }
                let j; try { j = JSON.parse(raw); } catch { throw new Error(`Workers AI: HTTP ${r.status}, the reply was not JSON: ${raw.slice(0, 200)}`); }
                if (!j.success) throw new Error(`Workers AI: HTTP ${r.status} ${JSON.stringify(j.errors)}`);
                if (j.result == null) throw new Error(`Workers AI: HTTP ${r.status} said success but sent no result`);
                return j.result;
              }
            };
            const ask = async (system, user) => {
              const res = await call(JSON.stringify({ messages: [{ role: 'system', content: system }, { role: 'user', content: user }], max_tokens: 16384 })); // EDIT: 8192 was cut off live (sharedkb #7, 28k-token prompt, 2026-11-13); about 100 tokens/s, so 16384 fits the 240 s timeout
              if (cutOff(res)) throw new Error(`Workers AI reply was cut off at max_tokens; not posting a partial answer. usage: ${JSON.stringify(res.usage ?? null)}`);
              const t = text(res).trim();
              if (!t) throw new Error(`Workers AI returned no text. Result keys: ${Object.keys(res).join(',')}; usage: ${JSON.stringify(res.usage ?? null)}`);
              core.info(`Model reply:\n${t}`);
              return t;
            };
            // norm: one line, plain dashes and quotes, so a quote copied by the model compares equal to the code
            const norm = (s) => String(s ?? '').replace(/[\u2010-\u2015\u2212]/g, '-').replace(/[\u2018\u2019]/g, "'").replace(/[\u201c\u201d]/g, '"').replace(/\s+/g, ' ').trim();
            // safe: model text goes into markdown, so no @mentions, no images, no raw HTML
            const safe = (s) => norm(s).replace(/</g, '&lt;').replace(/@(?=[\w-])/g, '@\u200b').replace(/!\[/g, '!\u200b[');
            const code = (s) => { const t = norm(s).slice(0, 200); return t.includes('`') ? `\`\` ${t} \`\`` : `\`${t}\``; };
            const json = (raw, what) => {
              let o; try { o = JSON.parse(raw.match(/\{[\s\S]*\}/)?.[0] ?? ''); } catch { o = null; }
              if (!o || typeof o !== 'object' || Array.isArray(o)) throw new Error(`AI ${what}: the reply was not the expected JSON (see "Model reply" in the log); nothing posted`);
              return o;
            };
            const { owner, repo } = context.repo;
            if (context.eventName === 'pull_request') {
              const pr = context.payload.pull_request; if (pr.draft) return;
              const { data: diff } = await github.rest.pulls.get({ owner, repo, pull_number: pr.number, mediaType: { format: 'diff' } });
              const allDiff = String(diff); const shownDiff = allDiff.slice(0, DIFF_CAP);
              // Full text of each changed file at the PR head, so "undefined" or "unused" claims can be checked against the whole file.
              const files = await github.paginate(github.rest.pulls.listFiles, { owner, repo, pull_number: pr.number, per_page: 100 });
              const full = []; const partial = []; let used = 0;
              for (const f of files) {
                if (f.status === 'removed') continue;
                if (used >= FILES_TOTAL) { partial.push(f.filename); continue; }
                try {
                  const { data } = await github.rest.repos.getContent({ owner, repo, path: f.filename, ref: pr.head.sha });
                  if (Array.isArray(data) || data.encoding !== 'base64' || data.size > FILE_CAP) { partial.push(f.filename); continue; }
                  const body = Buffer.from(data.content, 'base64').toString('utf8');
                  if (body.includes('\u0000')) { partial.push(f.filename); continue; } // binary
                  const room = Math.min(FILE_CAP, FILES_TOTAL - used);
                  if (body.length > room) partial.push(f.filename);
                  full.push({ path: f.filename, body: body.slice(0, room) }); used += Math.min(body.length, room);
                } catch { partial.push(f.filename); }
              }
              const numbered = full.map((f) => `=== ${f.path} ===\n${f.body.split('\n').map((l, i) => `${i + 1}| ${l}`).join('\n')}`).join('\n\n');
              const raw = await ask(
                'You review a pull request. You get its title and description, the unified diff, and the FULL text of each changed file at the PR head with numbered lines.\n' +
                'Rules:\n1. Report only real problems in the changed code: bugs, security (secrets, injection, unsafe defaults), broken error handling, data loss. No style advice. No generic "add tests" or "add logging" unless you name the exact case that breaks.\n' +
                '2. Before saying something is undefined, unused or missing, search the full file. If a file is listed as not provided in full, make no such claim about it.\n' +
                '3. Every finding quotes the exact code line it is about, copied character for character, without the line number.\n' +
                '4. Severity: BLOCKER (wrong result, data loss, secret exposure, security hole), SHOULD (real, limited impact), NIT (minor). At most 10 findings, most severe first.\n' +
                '5. Do not report: what a future change might break, anything the code already handles, behaviour a code comment says is intended, or anything you are not sure of. A secret leak means a real secret value (token, password, key) can reach output or logs; text the PR author can already see is not a leak.\n' +
                '6. Never repeat a secret value.\n' +
                'Reply with JSON only: {"findings": [{"severity": "BLOCKER|SHOULD|NIT", "file": "path", "line": 1, "quote": "exact code", "issue": "what is wrong and what happens", "fix": "the change"}]}. If nothing material, findings is [].',
                `Title: ${pr.title}\n\nDescription:\n${pr.body ?? ''}\n\nDiff${allDiff.length > DIFF_CAP ? ` (first ${DIFF_CAP} of ${allDiff.length} characters; the rest is not shown, do not report on it)` : ''}:\n${shownDiff}\n\nFull files at head:\n${numbered}\n\nNot provided in full: ${partial.join(', ') || 'none'}`);
              const found = json(raw, 'review').findings;
              if (!Array.isArray(found)) throw new Error('AI review: the reply had no findings list (see "Model reply" in the log); nothing posted');
              // Proof: the lines a quote may come from, per file: the full text at head, plus that file's added lines in the diff.
              // Removed lines and diff headers never count; a quote must match a whole line or be 15+ characters.
              const src = new Map(); const add = (p, ls) => src.set(p, [...(src.get(p) ?? []), ...ls]);
              for (const f of full) add(f.path, f.body.split('\n').map(norm));
              let cur = null; let inHunk = false;
              for (const l of shownDiff.split('\n')) {
                const h = l.match(/^diff --git a\/.+? b\/(.+)$/);
                if (h) { cur = h[1]; inHunk = false; continue; }
                if (l.startsWith('@@')) { inHunk = true; continue; }
                if (cur && inHunk && l.startsWith('+')) add(cur, [norm(l.slice(1))]);
              }
              const proven = (f) => {
                const want = norm(f?.file).replace(/^(\.\/|[ab]\/)/, '');
                const q = String(f?.quote ?? '');
                const qs = [norm(q), norm(q.split('\n').map((l) => l.replace(/^\+/, '')).join('\n'))];
                return !!want && [...src].some(([path, ls]) => (path === want || path.endsWith(`/${want}`)) &&
                  qs.some((x) => (x.length >= 6 && ls.includes(x)) || (x.length >= 15 && ls.join(' ').includes(x))));
              };
              const SEV = ['BLOCKER', 'SHOULD'];
              const ALIAS = { CRITICAL: 'BLOCKER', HIGH: 'BLOCKER', MEDIUM: 'SHOULD', MAJOR: 'SHOULD' };
              const sev = (f) => { const s = String(f?.severity ?? '').trim().toUpperCase(); return ALIAS[s] ?? s; };
              const real = found.filter((f) => SEV.includes(sev(f)) && proven(f)).sort((a, b) => SEV.indexOf(sev(a)) - SEV.indexOf(sev(b)));
              const top = real.slice(0, SHOW);
              const nits = found.filter((f) => !SEV.includes(sev(f))).length;
              const unproven = found.filter((f) => SEV.includes(sev(f)) && !proven(f)).length;
              const over = real.length - top.length;
              const hidden = [nits && `${nits} NIT`, unproven && `${unproven} whose quote is not in the code`, over && `${over} over the limit of ${SHOW}`].filter(Boolean).join(', ');
              const lines = top.map((f, i) => `${i + 1}. **${sev(f)}** \`${norm(f.file).replace(/`/g, "'") || '?'}${f.line ? `:${norm(f.line)}` : ''}\`: ${safe(f.issue ?? f.problem)}\n   ${code(f.quote)}\n   Fix: ${safe(f.fix)}`);
              const { data: now } = await github.rest.pulls.get({ owner, repo, pull_number: pr.number });
              const late = now.merged ? '**Note:** this pull request was merged before the review finished. Open a follow-up pull request for any BLOCKER below.\n\n' : '';
              const body = `**Cloudflare AI review** (${MODEL}) for ${String(pr.head.sha).slice(0, 7)}\n${MARK}\n\n${late}${lines.length ? lines.join('\n') : 'No material findings.'}\n\n` +
                `<sub>Advisory. Shows BLOCKER and SHOULD points whose quoted line is in the code${hidden ? `; hidden: ${hidden}` : ''}.${partial.length ? ` Not read in full: ${partial.join(', ')}.` : ''} Full reply: [run log](${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}). Updated on every push.</sub>`;
              const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: pr.number, per_page: 100 });
              const mine = comments.find((c) => c.user?.login === 'github-actions[bot]' && OLD_MARKS.some((m) => String(c.body ?? '').includes(m)));
              if (mine) await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
              else await github.rest.issues.createComment({ owner, repo, issue_number: pr.number, body });
            } else if (context.eventName === 'issues') {
              const is = context.payload.issue;
              const labels = await github.paginate(github.rest.issues.listLabelsForRepo, { owner, repo, per_page: 100 });
              const raw = await ask('Triage a GitHub issue. Reply with JSON only: {"labels": [names chosen ONLY from the given list], "summary": "one line", "next_step": "the first concrete step", "copilot_ready": true|false}. copilot_ready is true when the issue is specific enough for an AI coding agent to implement alone.',
                `Available labels: ${labels.map((l) => l.name).join(', ')}\n\nTitle: ${is.title}\n\n${is.body ?? ''}`);
              const t = json(raw, 'triage'); // CHANGED 2026-11-13: a reply that is not JSON used to post an empty triage comment
              const ok = (Array.isArray(t.labels) ? t.labels : []).filter((n) => labels.some((l) => l.name === n));
              if (ok.length) await github.rest.issues.addLabels({ owner, repo, issue_number: is.number, labels: ok });
              await github.rest.issues.createComment({ owner, repo, issue_number: is.number, body: `**Cloudflare AI triage**\n\n${safe(t.summary)}\n\nNext step: ${safe(t.next_step)}\n\n${t.copilot_ready === true ? 'Ready for Copilot: assign this issue to Copilot to have it open a pull request.' : 'Needs more detail before Copilot can take it.'}` });
            }
