name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Secret scan (gitleaks)
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.18.4 detect --source /repo --redact -v
      - name: No private (RFC 1918) addresses
        run: |
          if grep -rEnI --exclude-dir=.git '\b(10\.[0-9]{1,3}|172\.(1[6-9]|2[0-9]|3[01])|192\.168)\.[0-9]{1,3}\.[0-9]{1,3}\b' .; then
            echo "Private IP found: use RFC 5737 ranges (192.0.2.0/24, 198.51.100.0/24, 203.0.113.0/24)"; exit 1
          fi

  lint:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
      - name: Analyze PowerShell script
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Import-Module PSScriptAnalyzer
          $results = Invoke-ScriptAnalyzer -Path ./Audit-NewPC.ps1
          $results | Format-Table -AutoSize
          $errors = Invoke-ScriptAnalyzer -Path ./Audit-NewPC.ps1 -Severity Error
          if ($errors) {
            $errors | Format-List
            exit 1
          }

  read-only-guard:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Pester
        shell: pwsh
        run: Install-Module Pester -MinimumVersion 5.0.0 -Force -Scope CurrentUser
      - name: Run read-only guard
        shell: pwsh
        run: Invoke-Pester -Path ./tests/ReadOnly.Tests.ps1 -CI
